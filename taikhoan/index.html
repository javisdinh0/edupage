<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tài khoản — Không gian dạy và học</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Lora:ital,wght@0,400;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F0F8FA;
            --bg-card: #FFFFFF;
            --c-yellow: #F9E8A2;
            --c-blue-1: #B4E1EB;
            --c-blue-2: #95BDD7;
            --c-blue-3: #78A4CB;
            --accent: #78A4CB;
            --accent-light: #95BDD7;
            --text-main: #34495e;
            --text-dim: #7f8c8d;
            --danger: #e74c3c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at center, var(--c-blue-1) 0%, var(--bg-color) 100%);
            color: var(--text-main);
            font-family: 'Lora', serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            overflow-x: hidden;
        }

        a { color: inherit; }

        .container { max-width: 760px; width: 100%; }

        .back-link {
            display: inline-flex; align-items: center; gap: 0.4rem; margin-bottom: 1.5rem;
            text-decoration: none; color: var(--text-dim);
            font-family: 'Inter', sans-serif; font-size: 0.88rem; font-weight: 500;
            transition: color 0.2s ease;
        }
        .back-link:hover { color: var(--c-blue-3); }
        .back-link svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        .header { text-align: center; margin-bottom: 2.5rem; animation: fadeInDown 1s ease-out; }
        .header .logo {
            width: 64px; height: 64px; margin: 0 auto 1.2rem;
            background: var(--c-blue-3); border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 25px rgba(120, 164, 203, 0.4);
        }
        .header .logo svg { width: 36px; height: 36px; stroke: #fff; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .header h1 {
            font-family: 'Merriweather', serif;
            font-size: 1.9rem; font-weight: 700; color: var(--c-blue-3);
            line-height: 1.3; margin-bottom: 0.8rem;
        }
        .header .subtitle {
            display: inline-block; background-color: var(--c-yellow); color: var(--text-main);
            padding: 0.5rem 1.4rem; border-radius: 8px;
            font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.95rem;
            text-transform: uppercase; letter-spacing: 1px;
        }

        .card {
            background: var(--bg-card); border-radius: 16px; padding: 2.5rem;
            box-shadow: 0 15px 40px rgba(120, 164, 203, 0.18);
            border-top: 5px solid var(--c-blue-3);
            animation: fadeIn 0.8s ease-out;
        }

        /* Login */
        .login-card { max-width: 440px; margin: 0 auto; }
        .field { margin-bottom: 1.3rem; }
        .field label {
            display: block; margin-bottom: 0.5rem;
            font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.9rem; color: var(--c-blue-3);
        }
        .field input {
            width: 100%; padding: 0.85rem 1rem;
            background: #f8fcfd; border: 1px solid var(--c-blue-1); border-radius: 8px;
            color: var(--text-main); font-family: 'Inter', sans-serif; font-size: 0.95rem;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }
        .field input::placeholder { color: var(--c-blue-2); font-style: italic; }
        .field input:focus {
            outline: none; border-color: var(--c-blue-3); background: #fff;
            box-shadow: 0 0 0 3px rgba(120, 164, 203, 0.2);
        }
        .field input.input-error { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(231,76,60,0.15); }

        .btn-primary {
            width: 100%; padding: 1rem; background: var(--accent); color: #fff;
            border: none; border-radius: 8px;
            font-family: 'Inter', sans-serif; font-size: 1rem; font-weight: 600;
            cursor: pointer; transition: background-color 0.25s ease, transform 0.15s ease;
        }
        .btn-primary:hover { background: var(--accent-light); }
        .btn-primary:active { transform: scale(0.98); }
        .btn-primary:disabled { opacity: 0.7; cursor: default; }

        .login-err {
            color: var(--danger); text-align: center; margin-top: 1rem;
            font-family: 'Inter', sans-serif; font-size: 0.9rem; display: none;
        }
        .login-err.show { display: block; animation: fadeIn 0.3s ease; }

        /* Portal buttons */
        #portal-view { display: none; }
        .portal-head {
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; gap: 1rem; margin-bottom: 1.8rem;
        }
        .portal-head .greeting { font-family: 'Inter', sans-serif; color: var(--text-dim); font-size: 0.95rem; }
        .portal-head .greeting strong { color: var(--c-blue-3); }
        .portal-head .role-badge {
            display: inline-block; margin-left: 0.5rem;
            background: var(--c-blue-1); color: var(--c-blue-3);
            font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
            padding: 0.15rem 0.5rem; border-radius: 5px; vertical-align: middle;
        }
        .btn-logout {
            background: transparent; border: 1px solid var(--c-blue-1); color: var(--text-dim);
            padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer;
            font-family: 'Inter', sans-serif; font-size: 0.85rem; transition: all 0.2s ease;
        }
        .btn-logout:hover { border-color: var(--c-blue-3); color: var(--c-blue-3); }

        .link-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.2rem; }
        .link-tile {
            display: flex; flex-direction: column; gap: 0.6rem;
            text-decoration: none; color: var(--text-main);
            background: #f8fcfd; border: 1px solid var(--c-blue-1); border-radius: 12px;
            padding: 1.5rem; transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }
        .link-tile:hover {
            transform: translateY(-4px); border-color: var(--c-blue-3);
            box-shadow: 0 12px 24px rgba(120, 164, 203, 0.25);
        }
        .link-tile .tile-icon {
            width: 48px; height: 48px; border-radius: 12px; background: var(--c-blue-1);
            display: flex; align-items: center; justify-content: center; margin-bottom: 0.3rem;
        }
        .link-tile:hover .tile-icon { background: var(--c-blue-3); }
        .link-tile .tile-icon svg { width: 26px; height: 26px; stroke: var(--c-blue-3); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: stroke 0.2s ease; }
        .link-tile:hover .tile-icon svg { stroke: #fff; }
        .link-tile h3 { font-family: 'Merriweather', serif; font-size: 1.15rem; color: var(--c-blue-3); }
        .link-tile p { font-family: 'Inter', sans-serif; font-size: 0.88rem; color: var(--text-dim); line-height: 1.5; }

        .empty-note {
            text-align: center; padding: 2rem 1rem; color: var(--text-dim);
            font-family: 'Inter', sans-serif; font-size: 0.92rem;
        }

        .footer-note {
            text-align: center; margin-top: 2rem;
            font-family: 'Inter', sans-serif; font-size: 0.82rem; color: var(--text-dim);
        }

        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        @media (max-width: 600px) {
            .header h1 { font-size: 1.6rem; }
            .card { padding: 1.8rem; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a class="back-link" href="../"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg> Về trang chủ</a>

        <div class="header">
            <div class="logo">
                <svg viewBox="0 0 24 24"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg>
            </div>
            <h1>Tài khoản</h1>
            <div class="subtitle">Không gian dạy và học</div>
        </div>

        <!-- LOGIN VIEW -->
        <div id="login-view" class="card login-card">
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Nhập email..." autocomplete="username">
            </div>
            <div class="field">
                <label for="pwd">Mật khẩu</label>
                <input type="password" id="pwd" placeholder="Nhập mật khẩu..." autocomplete="current-password">
            </div>
            <button class="btn-primary" id="btn-login">Đăng Nhập</button>
            <p class="login-err" id="login-err">Email hoặc mật khẩu không đúng!</p>
        </div>

        <!-- PORTAL VIEW (after login) -->
        <div id="portal-view" class="card">
            <div class="portal-head">
                <div class="greeting">Xin chào, <strong id="who">—</strong><span class="role-badge" id="role-badge"></span></div>
                <button class="btn-logout" id="btn-logout">Đăng xuất</button>
            </div>
            <div class="link-grid" id="link-grid"><!-- populated by JS --></div>
            <p class="footer-note">Phiên đăng nhập được giữ trong tab này — mở các công cụ bên dưới sẽ không phải nhập lại mật khẩu.</p>
        </div>
    </div>

    <script>
        // Same public endpoint + auth key as admin/ and congcuthongkediem/ (server validates the password + trả role).
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx-SeWQ9aCi3BbQyg0ODPa0MP8Wa-eiUJxFXQSU6LBLGxnx00O7NwK3Lfgjeqw6Nm4B/exec';
        const AUTH_KEY = 'dinhtieuthuong_auth'; // phiên dùng chung toàn portal (SSO)

        // Chức năng theo vai trò: 'admin' thấy tất cả, 'user' (GV bộ môn) chỉ thấy công cụ điểm.
        const FUNCTIONS = [
            {
                title: 'Bảng điều khiển Admin',
                desc: 'Thống kê, biểu đồ khảo sát, xuất Excel & in báo cáo PDF.',
                href: '../admin/',
                roles: ['admin'],
                icon: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>'
            },
            {
                title: 'Công cụ thống kê điểm',
                desc: 'Tải điểm thi tháng, phân loại, biểu đồ & danh sách phụ đạo.',
                href: '../congcuthongkediem/',
                roles: ['admin', 'user'],
                icon: '<svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>'
            }
        ];

        const ROLE_LABEL = { admin: 'Quản trị viên', user: 'Giáo viên' };

        async function sha256(message) {
            const buf = new TextEncoder().encode(message);
            const hash = await crypto.subtle.digest('SHA-256', buf);
            return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function serverLogin(email, passHash) {
            const res = await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // simple request -> no CORS preflight
                body: JSON.stringify({ action: 'login', email: email, passHash: passHash })
            });
            return await res.json();
        }

        function renderPortal(email, role) {
            document.getElementById('who').textContent = email || 'người dùng';
            const badge = document.getElementById('role-badge');
            badge.textContent = ROLE_LABEL[role] || role || '';

            const items = FUNCTIONS.filter(f => f.roles.includes(role));
            const grid = document.getElementById('link-grid');
            grid.innerHTML = items.length
                ? items.map(f =>
                    `<a class="link-tile" href="${f.href}">
                        <span class="tile-icon">${f.icon}</span>
                        <h3>${f.title}</h3>
                        <p>${f.desc}</p>
                    </a>`).join('')
                : '<p class="empty-note">Tài khoản của bạn chưa được gán chức năng nào. Liên hệ quản trị viên để được cấp quyền.</p>';

            document.getElementById('login-view').style.display = 'none';
            document.getElementById('portal-view').style.display = 'block';
        }

        const emailEl = document.getElementById('email');
        const pwdEl = document.getElementById('pwd');
        const errEl = document.getElementById('login-err');

        async function doLogin() {
            const email = emailEl.value.trim();
            const pwd = pwdEl.value;
            emailEl.classList.remove('input-error');
            pwdEl.classList.remove('input-error');
            errEl.classList.remove('show');

            if (!pwd) { pwdEl.classList.add('input-error'); pwdEl.focus(); return; }

            const btn = document.getElementById('btn-login');
            btn.textContent = 'Đang kiểm tra...';
            btn.disabled = true;
            try {
                const passHash = await sha256(pwd);
                const result = await serverLogin(email, passHash);
                if (result && result.ok) {
                    try { sessionStorage.setItem(AUTH_KEY, JSON.stringify({ email: email, passHash: passHash })); } catch (e) {}
                    renderPortal(email, result.role);
                    return;
                }
            } catch (e) { console.error(e); }
            errEl.classList.add('show');
            emailEl.classList.add('input-error');
            pwdEl.classList.add('input-error');
            btn.textContent = 'Đăng Nhập';
            btn.disabled = false;
        }

        document.getElementById('btn-login').addEventListener('click', doLogin);
        pwdEl.addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });
        [emailEl, pwdEl].forEach(el => el.addEventListener('input', () => { el.classList.remove('input-error'); errEl.classList.remove('show'); }));

        document.getElementById('btn-logout').addEventListener('click', () => {
            try { sessionStorage.removeItem(AUTH_KEY); } catch (e) {}
            document.getElementById('portal-view').style.display = 'none';
            document.getElementById('login-view').style.display = 'block';
            pwdEl.value = '';
        });

        // If already logged in during this tab session, re-verify with server to get a fresh role.
        (async function restoreSession() {
            let saved = null;
            try { saved = JSON.parse(sessionStorage.getItem(AUTH_KEY) || 'null'); } catch (e) {}
            if (!saved || !saved.passHash) return;
            try {
                const result = await serverLogin(saved.email || '', saved.passHash);
                if (result && result.ok) { renderPortal(saved.email, result.role); return; }
            } catch (e) { /* fall through to login form */ }
            try { sessionStorage.removeItem(AUTH_KEY); } catch (e) {}
        })();
    </script>
</body>
</html>
